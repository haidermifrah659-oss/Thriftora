<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout — Thriftora</title><meta name="description" content="Enter your delivery details and place a Cash on Delivery order."><meta property="og:title" content="Checkout — Thriftora"><meta property="og:description" content="A few details and your find is on its way."><meta property="og:type" content="website"><meta property="og:image" content="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=1200&q=85"><link rel="stylesheet" href="css/style.css"><script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script><script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script><script defer src="js/config.js"></script><script defer src="js/products.js"></script><script defer src="js/cart.js"></script><script defer src="js/components.js"></script><script defer src="js/main.js"></script><script defer src="js/animations.js"></script></head><body data-page="checkout"><a class="skip-link" href="#main">Skip to content</a><main id="main"><section class="container page-hero"><nav class="breadcrumb" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><a href="cart.html">Cart</a><span>/</span><span aria-current="page">Checkout</span></nav><span class="eyebrow">Delivery details</span><h1>Make it yours.</h1><a class="btn btn-ghost btn-small" href="cart.html">← Back to cart</a></section><section class="container checkout-layout" id="checkout-content"><form class="checkout-form" id="checkout-form"><h2 style="font-size:2rem">Where should we send it?</h2><div class="field"><label for="name">Full name</label><input class="input" id="name" name="name" autocomplete="name" required maxlength="80"></div><div class="field"><label for="phone">Pakistani mobile number</label><input class="input" id="phone" name="phone" type="tel" autocomplete="tel" placeholder="0300 1234567" required maxlength="20"></div><div class="field"><label for="city">City</label><input class="input" id="city" name="city" autocomplete="address-level2" required maxlength="60"></div><div class="field"><label for="address">Complete delivery address</label><textarea class="input" id="address" name="address" autocomplete="street-address" required maxlength="300"></textarea></div><div class="field"><label for="notes">Order notes <span class="muted">(optional)</span></label><textarea class="input" id="notes" name="notes" maxlength="300"></textarea></div><fieldset class="field" style="border:0;padding:0"><legend>Payment method</legend><label class="radio-card"><input type="radio" name="payment" checked disabled><span><strong>Cash on Delivery</strong><br><small>Pay when your order arrives.</small></span></label></fieldset><button class="btn btn-primary" type="submit">Place order on WhatsApp ↗</button><p class="muted">Your WhatsApp message will be prepared with your order details.</p></form><aside class="checkout-summary" id="checkout-summary" aria-label="Order summary"></aside></section></main></body></html>
